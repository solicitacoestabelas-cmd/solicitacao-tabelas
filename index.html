<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitação de Tabelas</title>
<style>
  :root{
    --vermelho: #D50004;
    --vermelho-escuro: #A50003;
    --fundo: #f7f2f2;
    --texto: #241111;
    --texto-suave: #6b5a5a;
    --alerta: #a3540e;
    --alerta-fundo: #fdf1e6;
    --sucesso: #2f7a4f;
    --erro: #a3130f;
    --borda: #e7d6d6;
    --branco: #ffffff;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--fundo);
    color: var(--texto);
    -webkit-tap-highlight-color: transparent;
  }

  .topo{
    background: var(--vermelho);
    color: var(--branco);
    padding: 18px 20px;
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 12px;
  }

  .topo h1{
    margin:0;
    font-size: 1.2rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .topo img{
    height: 44px;
    width: 44px;
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 1px 4px rgba(0,0,0,0.25);
  }

  .aviso{
    display:flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--alerta-fundo);
    border: 1px solid #f0d3b5;
    color: var(--alerta);
    padding: 12px 14px;
    margin: 14px 16px 0;
    border-radius: 10px;
    font-size: 0.85rem;
    line-height: 1.35;
  }

  .aviso .icone{ font-size: 1.1rem; line-height: 1; flex-shrink:0; }

  main{
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
  }

  form{
    background: var(--branco);
    border-radius: 14px;
    padding: 18px;
    box-shadow: 0 1px 3px rgba(60,10,10,0.08);
  }

  label{
    display:block;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--texto);
    margin-bottom: 6px;
  }

  .campo{ margin-bottom: 18px; }

  .dica{
    font-size: 0.78rem;
    color: var(--texto-suave);
    margin-top: 4px;
  }

  input[type="text"], select{
    width: 100%;
    padding: 13px 12px;
    font-size: 1rem;
    border: 1.5px solid var(--borda);
    border-radius: 10px;
    background: var(--branco);
    color: var(--texto);
    appearance: none;
    -webkit-appearance: none;
  }

  select{
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' stroke='%236b5a5a' stroke-width='2' fill='none' fill-rule='evenodd'/></svg>");
    background-repeat: no-repeat;
    background-position: right 14px center;
    padding-right: 34px;
  }

  input:focus, select:focus{
    outline: none;
    border-color: var(--vermelho);
    box-shadow: 0 0 0 3px rgba(213,0,4,0.18);
  }

  input.invalido{
    border-color: var(--erro);
  }

  .erro-campo{
    font-size: 0.78rem;
    color: var(--erro);
    margin-top: 4px;
    display:none;
  }

  .erro-campo.mostrar{ display:block; }

  button{
    width:100%;
    padding: 15px;
    font-size: 1rem;
    font-weight: 700;
    color: var(--branco);
    background: var(--vermelho);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }

  button:disabled{
    opacity: 0.5;
    cursor: not-allowed;
  }

  button:active:not(:disabled){ opacity: 0.85; }

  .status{
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 0.9rem;
    display:none;
  }

  .status.mostrar{ display:block; }

  .status.sucesso{
    background: #e9f6ee;
    color: var(--sucesso);
    border: 1px solid #bfe4cd;
  }

  .status.erro{
    background: #fbeceb;
    color: var(--erro);
    border: 1px solid #f2c6c2;
  }

  .status.carregando{
    background: #f4eaea;
    color: var(--texto-suave);
    border: 1px solid var(--borda);
  }

  select:disabled{
    color: var(--texto-suave);
  }

  .lista-titulo{
    display:flex;
    justify-content: space-between;
    align-items: baseline;
    margin: 22px 0 10px;
  }

  .lista-titulo h2{
    font-size: 0.95rem;
    margin: 0;
    color: var(--texto);
  }

  .lista-vazia{
    font-size: 0.85rem;
    color: var(--texto-suave);
    text-align: center;
    padding: 18px 0;
    border: 1.5px dashed var(--borda);
    border-radius: 10px;
  }

  .item-pv{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 12px;
    background: var(--branco);
    border: 1.5px solid var(--borda);
    border-left: 4px solid var(--vermelho);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }

  .item-pv .info{ line-height: 1.5; }

  .item-pv .linha-pv{
    display:flex;
    align-items:baseline;
    gap: 8px;
    flex-wrap: wrap;
  }

  .item-pv .selo-pv{
    display:inline-block;
    background: var(--vermelho);
    color: var(--branco);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 2px 8px;
    border-radius: 6px;
  }

  .item-pv .nome-cliente{
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--texto);
  }

  .item-pv .linha-detalhe{
    font-size: 0.8rem;
    color: var(--texto-suave);
    margin-top: 3px;
  }

  .item-pv .linha-detalhe b{
    color: var(--vermelho-escuro);
    font-weight: 600;
  }

  .item-pv button.remover{
    width: auto;
    padding: 7px 12px;
    font-size: 0.75rem;
    font-weight: 700;
    background: transparent;
    color: var(--erro);
    border: 1.5px solid var(--erro);
    border-radius: 8px;
    flex-shrink: 0;
    white-space: nowrap;
  }

  .botao-enviar-tudo{ margin-top: 14px; }

  .nome-fantasia{
    font-size: 0.82rem;
    margin-top: 5px;
    font-weight: 600;
    min-height: 1.1em;
  }

  .nome-fantasia.encontrado{ color: var(--sucesso); }
  .nome-fantasia.nao-encontrado{ color: var(--alerta); }
  .nome-fantasia.buscando{ color: var(--texto-suave); font-weight: 400; }

  .chips-container{
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .chip{
    padding: 10px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    border: 1.5px solid var(--borda);
    border-radius: 999px;
    background: var(--branco);
    color: var(--texto);
    cursor: pointer;
    user-select: none;
    transition: all 0.12s ease;
  }

  .chip.selecionada{
    background: var(--vermelho);
    border-color: var(--vermelho);
    color: var(--branco);
  }

  .contador-pill{
    display:inline-block;
    background: var(--vermelho);
    color: var(--branco);
    font-size: 0.75rem;
    font-weight: 700;
    padding: 2px 9px;
    border-radius: 999px;
  }
</style>
</head>

    <div class="lista-titulo">
      <h2>PVs nesta solicitação</h2>
      <span id="contador" class="contador-pill">0</span>
    </div>

    <div id="listaVazia" class="lista-vazia">Nenhum PV adicionado ainda</div>
    <div id="listaItens"></div>

    <button type="button" id="botaoEnviarTudo" class="botao-enviar-tudo" disabled>Enviar tudo</button>
    <div class="status" id="statusEnvio"></div>
  </main>

<script>
  // ===================== CONFIGURAÇÃO =====================
  const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwrP-7zt9y0n9GRbd4rxalQacFJ_ig_Mxsks-xbed3ODWdtnEFwhfj2RdTgA7B6f72VoQ/exec";

  const GERENCIAS = [
    "GC. G1", "GC. GU", "GC. G3", "GC. UR", "GC. IT", "GC. MO",
    "GC. RI", "GC. PO", "GC. RV", "GC. SL", "GC. AN", "GC. AP",
    "GC. DI", "GC. G2", "GC. PA", "GC. AT"
  ];
  // ==========================================================

  const form = document.getElementById('formulario');
  const campoCodigo = document.getElementById('codigoCliente');
  const erroCodigo = document.getElementById('erroCodigo');
  const nomeFantasiaInfo = document.getElementById('nomeFantasiaInfo');
  const campoGerencia = document.getElementById('gerencia');

  let nomeFantasiaAtual = ''; // referente ao PV atualmente digitado no campo
  const cacheNomesFantasia = {}; // cache em memória: código -> nome (evita repetir buscas na mesma sessão)
  const tabelasContainer = document.getElementById('tabelasContainer');
  const erroTabela = document.getElementById('erroTabela');
  const statusFormulario = document.getElementById('statusFormulario');

  let tabelasSelecionadas = new Set();

  const listaVazia = document.getElementById('listaVazia');
  const listaItens = document.getElementById('listaItens');
  const contador = document.getElementById('contador');
  const botaoEnviarTudo = document.getElementById('botaoEnviarTudo');
  const statusEnvio = document.getElementById('statusEnvio');

  let itens = []; // { codigoCliente, gerencia, tabela }
  let dataHoraInicio = new Date().toISOString();

  function preencherGerencias(){
    GERENCIAS.forEach(g => {
      const opt = document.createElement('option');
      opt.value = g;
      opt.textContent = g;
      campoGerencia.appendChild(opt);
    });
  }

  function mostrarStatus(elemento, texto, tipo){
    elemento.textContent = texto;
    elemento.className = 'status mostrar ' + tipo;
  }

  function ocultarStatus(elemento){
    elemento.className = 'status';
  }

  // ---------- Tabelas: cache local + busca em segundo plano ----------
  const CACHE_CHAVE = 'tabelas_cache_v1';
  const CACHE_VALIDADE_MS = 6 * 60 * 60 * 1000; // 6 horas

  function preencherOpcoesTabela(lista){
    // preserva o que já estava marcado, se ainda existir na nova lista
    const marcadasAntes = new Set([...tabelasSelecionadas].filter(t => lista.includes(t)));
    tabelasSelecionadas = marcadasAntes;

    tabelasContainer.innerHTML = '';
    if(lista.length === 0){
      tabelasContainer.innerHTML = '<span class="dica">Nenhuma tabela cadastrada.</span>';
      return;
    }

    lista.forEach(t => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip' + (tabelasSelecionadas.has(t) ? ' selecionada' : '');
      chip.textContent = t;
      chip.addEventListener('click', () => {
        if(tabelasSelecionadas.has(t)){
          tabelasSelecionadas.delete(t);
          chip.classList.remove('selecionada');
        }else{
          tabelasSelecionadas.add(t);
          chip.classList.add('selecionada');
        }
        erroTabela.classList.remove('mostrar');
      });
      tabelasContainer.appendChild(chip);
    });
  }

  function lerCache(){
    try{
      const bruto = localStorage.getItem(CACHE_CHAVE);
      if(!bruto) return null;
      const cache = JSON.parse(bruto);
      if(Date.now() - cache.salvoEm > CACHE_VALIDADE_MS) return null;
      return cache.tabelas;
    }catch(e){ return null; }
  }

  function salvarCache(tabelas){
    try{
      localStorage.setItem(CACHE_CHAVE, JSON.stringify({ tabelas: tabelas, salvoEm: Date.now() }));
    }catch(e){ /* ignora se o navegador bloquear */ }
  }

  async function carregarTabelas(){
    const emCache = lerCache();
    if(emCache && emCache.length){
      preencherOpcoesTabela(emCache);
    }else{
      tabelasContainer.innerHTML = '<span class="dica">Carregando opções...</span>';
    }

    try{
      const resposta = await fetch(WEBAPP_URL, { method: 'GET' });
      const dados = await resposta.json();
      const tabelas = dados.tabelas || [];
      preencherOpcoesTabela(tabelas);
      salvarCache(tabelas);
    }catch(e){
      if(!emCache || !emCache.length){
        tabelasContainer.innerHTML = '<span class="dica" style="color:var(--erro)">Erro ao carregar. Verifique a conexão e recarregue a página.</span>';
      }
    }
  }

  // ---------- Máscara do PV + busca do Nome Fantasia ----------
  let buscaEmAndamento = 0; // token para ignorar respostas de buscas antigas/fora de ordem

  campoCodigo.addEventListener('input', () => {
    campoCodigo.value = campoCodigo.value.replace(/\D/g, '').slice(0, 7);
    erroCodigo.classList.remove('mostrar');
    campoCodigo.classList.remove('invalido');

    const codigo = campoCodigo.value;
    nomeFantasiaAtual = '';

    if(codigo.length !== 7){
      nomeFantasiaInfo.textContent = '';
      nomeFantasiaInfo.className = 'nome-fantasia';
      return;
    }

    buscarNomeFantasia(codigo);
  });

  async function buscarNomeFantasia(codigo){
    const minhaBusca = ++buscaEmAndamento;

    if(cacheNomesFantasia.hasOwnProperty(codigo)){
      exibirNomeFantasia(codigo, cacheNomesFantasia[codigo]);
      return;
    }

    nomeFantasiaInfo.textContent = 'Buscando cliente...';
    nomeFantasiaInfo.className = 'nome-fantasia buscando';

    try{
      const resposta = await fetch(WEBAPP_URL + '?pv=' + encodeURIComponent(codigo));
      const dados = await resposta.json();

      if(minhaBusca !== buscaEmAndamento) return; // usuário já mudou o campo, ignora resposta antiga
      if(campoCodigo.value !== codigo) return;

      const nome = dados.encontrado ? dados.nomeFantasia : null;
      cacheNomesFantasia[codigo] = nome;
      exibirNomeFantasia(codigo, nome);

    }catch(e){
      if(minhaBusca !== buscaEmAndamento) return;
      nomeFantasiaInfo.textContent = 'Não foi possível verificar o cliente (sem conexão).';
      nomeFantasiaInfo.className = 'nome-fantasia nao-encontrado';
    }
  }

  function exibirNomeFantasia(codigo, nome){
    if(campoCodigo.value !== codigo) return;
    if(nome){
      nomeFantasiaAtual = nome;
      nomeFantasiaInfo.textContent = '✓ ' + nome;
      nomeFantasiaInfo.className = 'nome-fantasia encontrado';
    }else{
      nomeFantasiaAtual = '';
      nomeFantasiaInfo.textContent = 'PV não encontrado na base — confira o número.';
      nomeFantasiaInfo.className = 'nome-fantasia nao-encontrado';
    }
  }

  // ---------- Renderizar lista de PVs adicionados ----------
  function renderizarLista(){
    contador.textContent = itens.length;
    botaoEnviarTudo.disabled = itens.length === 0;

    if(itens.length === 0){
      listaVazia.style.display = 'block';
      listaItens.innerHTML = '';
      return;
    }

    listaVazia.style.display = 'none';
    listaItens.innerHTML = '';

    itens.forEach((item, indice) => {
      const div = document.createElement('div');
      div.className = 'item-pv';
      div.innerHTML = `
        <div class="info">
          <div class="linha-pv">
            <span class="selo-pv">PV ${item.codigoCliente}</span>
            ${item.nomeFantasia ? '<span class="nome-cliente">' + item.nomeFantasia + '</span>' : ''}
          </div>
          <div class="linha-detalhe"><b>${item.gerencia}</b> · ${item.tabela}</div>
        </div>
        <button type="button" class="remover" data-indice="${indice}">Remover</button>
      `;
      listaItens.appendChild(div);
    });

    listaItens.querySelectorAll('.remover').forEach(botao => {
      botao.addEventListener('click', () => {
        const i = parseInt(botao.getAttribute('data-indice'), 10);
        itens.splice(i, 1);
        renderizarLista();
      });
    });
  }

  // ---------- Adicionar PV à lista local ----------
  form.addEventListener('submit', (evento) => {
    evento.preventDefault();
    ocultarStatus(statusFormulario);

    const codigo = campoCodigo.value.trim();
    const gerencia = campoGerencia.value;

    let valido = true;

    if(!/^\d{7}$/.test(codigo)){
      erroCodigo.classList.add('mostrar');
      campoCodigo.classList.add('invalido');
      valido = false;
    }

    if(!gerencia){
      mostrarStatus(statusFormulario, 'Selecione a gerência.', 'erro');
      valido = false;
    }

    if(tabelasSelecionadas.size === 0){
      erroTabela.classList.add('mostrar');
      valido = false;
    }

    if(!valido) return;

    // Um item por tabela marcada, mesmo PV e Gerência
    tabelasSelecionadas.forEach(tabela => {
      itens.push({ codigoCliente: codigo, gerencia: gerencia, tabela: tabela, nomeFantasia: nomeFantasiaAtual });
    });
    renderizarLista();

    // Limpa PV, nome fantasia e as tabelas marcadas, mas MANTÉM a gerência selecionada
    campoCodigo.value = '';
    nomeFantasiaAtual = '';
    nomeFantasiaInfo.textContent = '';
    nomeFantasiaInfo.className = 'nome-fantasia';
    tabelasSelecionadas.clear();
    tabelasContainer.querySelectorAll('.chip').forEach(c => c.classList.remove('selecionada'));
    campoCodigo.focus();
  });

  // ---------- Enviar tudo para a planilha ----------
  botaoEnviarTudo.addEventListener('click', async () => {
    if(itens.length === 0) return;
    ocultarStatus(statusEnvio);

    const dataHoraFim = new Date().toISOString();
    botaoEnviarTudo.disabled = true;
    mostrarStatus(statusEnvio, 'Enviando ' + itens.length + ' PV(s)...', 'carregando');

    try{
      const resposta = await fetch(WEBAPP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          dataHoraInicio: dataHoraInicio,
          dataHoraFim: dataHoraFim,
          itens: itens
        })
      });

      const resultado = await resposta.json();

      if(resultado.sucesso){
        mostrarStatus(statusEnvio, 'Enviado com sucesso!', 'sucesso');
        itens = [];
        renderizarLista();
        dataHoraInicio = new Date().toISOString();
      }else{
        mostrarStatus(statusEnvio, 'Erro ao enviar: ' + (resultado.erro || 'tente novamente.'), 'erro');
        botaoEnviarTudo.disabled = false;
      }
    }catch(e){
      mostrarStatus(statusEnvio, 'Falha de conexão. Verifique a internet e tente enviar novamente.', 'erro');
      botaoEnviarTudo.disabled = false;
    }
  });

  preencherGerencias();
  carregarTabelas();
  renderizarLista();
</script>

</body>
</html>
